<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#161c22">
  <title>Entre linhas</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #161c22; color: #eee7d9; }
    main { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 40px 24px; }
    h1 { max-width: 820px; margin: 0; font-family: Georgia, 'Times New Roman', serif; font-size: clamp(28px, 4.6vw, 52px); font-weight: 400; line-height: 1.5; text-align: center; text-wrap: balance; }
  </style>
</head>
<body>
  <main><h1>Já não tenho nada a escrever pra você, aproveita suas novas flores.</h1></main>
</body>
</html>
